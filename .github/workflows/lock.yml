name: Lock
on: push
jobs:
  lock:
      runs-on: ubuntu-latest
          permissions:
                contents: write
                    steps:
                          - uses: actions/checkout@v4
                                - uses: actions/setup-node@v4
                                        with:
                                                  node-version: 22
                                                        - run: npm install
                                                              - run: |
                                                                        git config user.name GitHub
                                                                                  git config user.email github@example.com
                                                                                            if git diff --name-only | grep -q package-lock.json; then
                                                                                                        git add package-lock.json
                                                                                                                    git commit -m "chore: regenerate lock"
                                                                                                                                git push
                                                                                                                                          fi
