name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    name: Lint, Type-check & Webpack Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        # --legacy-peer-deps is required because React 19 breaks strict peer
        # resolution in several packages that haven't updated their peerDeps yet.
        # Honored via .npmrc (legacy-peer-deps=true).
        run: npm ci

      - name: Type check (informational)
        # continue-on-error so pre-existing missing-module errors don't block CI.
        # Remove continue-on-error once all modules referenced in the codebase exist.
        run: npx tsc --noEmit
        continue-on-error: true

      - name: Lint
        run: npm run lint

      - name: Webpack build
        run: npm run build
        env:
          NODE_ENV: production

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist/
          retention-days: 7
